# Release — tag-triggered publish of agenteventprotocol-sdk to PyPI via trusted publishing
# (OIDC; no long-lived token secret). Dormant until a `v*` tag exists;
# tagging is a maintainer action (RELEASING.md). The guards make a stray tag
# safe: the tag must equal `__version__` exactly, and a package still
# carrying the `Private :: Do Not Upload` classifier (the pre-release shape)
# refuses to publish.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # PyPI trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The smoke's relay fixture is a Node program.

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.11.x

      - name: Build wheel + sdist
        run: uv build

      - name: Smoke (envelope + control machine + live HTTP→SSE)
        run: bash tests/run-smoke.sh

      - name: Tag must match aep_sdk.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -oE '^__version__ = "[^"]+"' aep_sdk/__init__.py | cut -d'"' -f2)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match aep_sdk.__version__ $pkg" >&2
            exit 1
          fi

      - name: Refuse to publish the private (pre-release) shape
        run: |
          if grep -q 'Private :: Do Not Upload' pyproject.toml; then
            echo 'pyproject.toml still carries the "Private :: Do Not Upload" classifier — this tag is not a release shape' >&2
            exit 1
          fi

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
